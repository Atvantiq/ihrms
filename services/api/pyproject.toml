[project]
name = "ihrms-api"
version = "0.1.0"
description = "Atvantiq People (iHRMS) backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",          # sync driver for Alembic
    "alembic>=1.14",
    "python-jose[cryptography]>=3.3", # Supabase JWT validation
    "slowapi>=0.1.9",                 # rate limiting
    "httpx>=0.28",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "types-python-jose>=3.3",
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
